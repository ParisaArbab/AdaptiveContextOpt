name: AITECH one-shot workflow validation

on:
  push:
    branches: [AITECH]
    paths:
      - ".github/workflows/aitech-cpu-workflow-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python and source
        run: |
          python --version
          test -f aitech/cpu_live_defects4j_pairs.py
          echo "AITECH workflow parser and runner OK"
