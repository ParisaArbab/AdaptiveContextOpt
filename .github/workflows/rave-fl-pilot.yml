name: RAVE-FL scoped tests
on:
  push:
    branches:
      - codex/rave-fl-adaptive-pilot
  workflow_dispatch:

jobs:
  test-rave-fl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-rave-pilot.txt
      - name: Run focused RAVE-FL tests
        run: |
          python -m pytest -q tests/test_core.py tests/test_rave_fl.py tests/test_rave_fl_adapter.py tests/test_rave_fl_evidence.py tests/test_rave_fl_expanded.py tests/test_rave_fl_phase3.py tests/test_rave_fl_pilot.py tests/test_rave_fl_rank_repair.py tests/test_rave_fl_extensions.py
