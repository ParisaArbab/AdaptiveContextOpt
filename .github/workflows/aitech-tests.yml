name: AITECH evidence selector tests

on:
  push:
    branches: [AITECH]
    paths:
      - "aitech/**"
      - "tests/test_aitech_*.py"
      - ".github/workflows/aitech-tests.yml"
  pull_request:
    paths:
      - "aitech/**"
      - "tests/test_aitech_*.py"
      - ".github/workflows/aitech-tests.yml"

jobs:
  aitech-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run dependency selection unit tests
        run: python -m unittest discover -s tests -p 'test_aitech_*.py' -v
      - name: Run risk-gated context experiment on archived Defects4J inputs
        run: python -m aitech.risk_gated_pilot --output /tmp/aitech-risk-gated-pilot.json
      - name: Analyze paired risk-gated outcomes without gold labels
        run: |
          python -m aitech.analyze_risk_gated_pilot \
            --input /tmp/aitech-risk-gated-pilot.json \
            --output-dir agent-output/risk_gated
          cp /tmp/aitech-risk-gated-pilot.json agent-output/risk_gated/results.json
      - name: Upload paired real-archive selector results
        uses: actions/upload-artifact@v4
        with:
          name: aitech-risk-gated-${{ github.run_id }}
          path: agent-output/risk_gated/
          retention-days: 30
      - name: Print deterministic demonstration
        run: python -m aitech.demo
      - name: Run archived SymPy trace pilot
        run: python -m aitech.sympy_trace_pilot --output /tmp/aitech-sympy-trace.json
      - name: Verify matched-budget trace result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/aitech-sympy-trace.json").read_text())
          a = result["conditions"]["relevance_only"]
          b = result["conditions"]["dependency_aware"]
          assert result["evidence_items"] == 7
          assert result["budget_tokens_proxy"] == 36
          assert a["tokens_proxy"] == b["tokens_proxy"] == 35
          assert a["known_dependency_violations"] == 1
          assert b["known_dependency_violations"] == 0
          print("Archived real-trace dependency microcase validated")
          PY
